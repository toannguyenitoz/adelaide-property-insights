name: Daily Adelaide Property Intelligence Update

on:
  schedule:
    # 6:00 AM ACST (Adelaide UTC+9:30) is 20:30 UTC previous day
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Safe Listings & Market Scraper
        run: |
          python scripts/scrape_expanded_safe.py

      - name: Generate Analytical Charts
        run: |
          python scripts/generate_charts.py
          python scripts/generate_expanded_charts.py
          python scripts/generate_chart7.py

      - name: Build Web Dashboard (index.html)
        run: |
          python scripts/build_website.py

      - name: Generate Branded PDF Report
        run: |
          python scripts/generate_pdf.py

      - name: Send Daily Top Properties Email Digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS || 'Theodorenguyensa@gmail.com, nguyenha.hanhlinh@gmail.com, nancyha.au@gmail.com' }}
        run: |
          python scripts/send_daily_email.py

      - name: Commit and Push Updated Data & Reports
        run: |
          git config --local user.name "Toan Nguyen IT OZ (Bot)"
          git config --local user.email "toannguyenitoz@gmail.com"
          git add data/ reports/ index.html
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(auto): daily market update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
